<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f7"><title>Enrollment — Intake Integrity demo</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:#1d1d1f;background:#f5f5f7;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}body{margin:0}header{height:76px;display:flex;justify-content:space-between;align-items:center;max-width:1100px;padding:0 24px;margin:auto}.brand{font-weight:720;letter-spacing:-.045em;font-size:18px}.muted{color:#86868b}.tag{font-size:12px;color:#86868b}main{max-width:580px;margin:clamp(45px,10vh,125px) auto;padding:0 20px 90px}.step{background:white;border-radius:25px;padding:clamp(25px,5vw,48px);box-shadow:0 12px 60px #00000006}.eyebrow{color:#86868b;font-size:12px;font-weight:650;margin-bottom:15px}h1{font-size:clamp(34px,5vw,50px);letter-spacing:-.06em;line-height:1.07;font-weight:650;margin:0 0 15px}p{font-size:15px;line-height:1.6;color:#6e6e73;margin:0 0 26px}label{display:block;font-size:13px;font-weight:650;margin:20px 0 8px}input{width:100%;border:0;border-radius:12px;background:#f5f5f7;padding:16px;font:inherit;font-size:16px;color:#1d1d1f;outline:none}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #8a8a92;outline-offset:3px}.button{width:100%;background:#1d1d1f;color:#fff;border:0;border-radius:13px;padding:17px 20px;font:inherit;font-weight:650;font-size:15px;cursor:pointer;margin-top:24px}.quiet{background:#ededf0;color:#1d1d1f;margin-top:10px}.inline{background:none;border:0;color:#6e6e73;font:inherit;font-size:13px;cursor:pointer;margin-top:18px;padding:8px}.choice{display:block;width:100%;text-align:left;background:#f5f5f7;border:0;border-radius:14px;padding:17px 18px;margin:10px 0;cursor:pointer;font:inherit;color:#1d1d1f}.choice strong{display:block;font-size:16px}.choice span{display:block;color:#6e6e73;font-size:13px;margin-top:5px}.choice.selected{background:#e6e6ea}.hint{font-size:12px;color:#86868b;margin-top:20px;line-height:1.6}.error{font-size:13px;color:#b3443a;margin-top:12px}.hidden{display:none!important}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.check{display:flex;gap:11px;align-items:flex-start;margin-top:24px;font-size:12px;line-height:1.6;color:#6e6e73}.check input{width:18px;height:18px;flex:0 0 18px;margin:2px 0;accent-color:#1d1d1f}.complete{font-size:42px;margin-bottom:20px}.foot{font-size:12px;color:#86868b;line-height:1.6;margin:22px 6px}a{color:inherit}@media(max-width:550px){header{height:65px}.step{padding:26px 22px;border-radius:20px}.fields{grid-template-columns:1fr}main{margin-top:48px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><header><div class="brand">Intake Integrity <span class="muted">/ Enrollment</span></div><a class="tag" href="./setup.html">Organization setup</a></header><main><section class="step" id="screen" aria-live="polite"></section><div class="foot">Synthetic demonstration. No real applications are retrieved or saved. This is not an identity-verification service.</div></main><script>(()=>{const db=[{id:"A-104",name:"Demo Student One",phone:"5550100100",program:"Design",status:"Incomplete application"},{id:"A-105",name:"Demo Student Two",phone:"5550100100",program:"Software",status:"Documents pending"},{id:"A-206",name:"Demo Student Three",phone:"5550100200",program:"Design",status:"Incomplete application"}];const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let stage="identify",name="",phone="",selected=null,found=[],newApplication=false;const button=(text,action,kind="")=>'<button type="button" class="button '+kind+'" data-action="'+action+'">'+text+'</button>';function render(){const back='<button type="button" class="inline" data-action="back">Back</button>';if(stage==="identify"){$("screen").innerHTML='<div class="eyebrow">Enrollment</div><h1>Let’s find your application.</h1><p>If you’ve started before, you can pick up where you left off.</p><form id="identify"><label for="name">Student or parent name</label><input id="name" name="name" autocomplete="name" required placeholder="Full name" value="'+esc(name)+'"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="+7 999 123 45 67" value="'+esc(phone)+'"><label class="check"><input id="consent" type="checkbox" required><span>I agree to the use of these details to find or create an enrollment application. <a href="#privacy" id="privacy-link">About data use</a></span></label><p class="error" id="error"></p><button class="button" type="submit">Continue</button></form>';return}if(stage==="found"){$("screen").innerHTML='<div class="eyebrow">Welcome back</div><h1>Is this your application?</h1><p>We found an application with matching details.</p>'+found.map((d,i)=>'<button class="choice '+(selected===i?"selected":"")+'" data-select="'+i+'"><strong>'+esc(d.name)+'</strong><span>'+esc(d.program)+' · '+esc(d.status)+'</span></button>').join("")+button("Continue application","continue")+button("This isn’t mine","not-mine","quiet")+back;return}if(stage==="multiple"){$("screen").innerHTML='<div class="eyebrow">One more detail</div><h1>Which application is yours?</h1><p>More than one application uses this phone number.</p>'+found.map((d,i)=>'<button class="choice '+(selected===i?"selected":"")+'" data-select="'+i+'"><strong>'+esc(d.name)+'</strong><span>'+esc(d.program)+' · '+esc(d.status)+'</span></button>').join("")+'<p class="error" id="error"></p>'+button("Continue","continue")+button("None of these","not-mine","quiet")+back;return}if(stage==="new"){$("screen").innerHTML='<div class="eyebrow">New application</div><h1>Start something new.</h1><p>We couldn’t confirm an existing application with these details.</p>'+button("Start application","start")+back;return}if(stage==="form"){$("screen").innerHTML='<div class="eyebrow">Application</div><h1>Tell us about the student.</h1><p>'+(newApplication?"New application":"Continue your application")+'</p><form id="enrollment"><label for="student">Student name</label><input id="student" name="student" required value="'+esc(newApplication?name:(found[selected]?.name||name))+'"><div class="fields"><div><label for="birth">Date of birth</label><input id="birth" name="birth" type="date" required></div><div><label for="program">Program</label><input id="program" name="program" required value="'+esc(newApplication?"":(found[selected]?.program||""))+'" placeholder="Program"></div></div><label for="representative">Legal representative</label><input id="representative" name="representative" required placeholder="Full name"><label for="payer">Payer</label><input id="payer" name="payer" required placeholder="Full name"><button class="button" type="submit">Submit application</button></form>'+back;return}if(stage==="done"){$("screen").innerHTML='<div class="eyebrow">Completed</div><h1>Application submitted.</h1><p>Your demo application is complete. No information was sent to a server.</p>'+button("Start again","reset");return}}function lookup(){const digits=phone.replace(/\D/g,"");const byPhone=db.filter(d=>d.phone===digits);const normalized=name.toLowerCase().trim();const byName=byPhone.filter(d=>d.name.toLowerCase()===normalized);found=byName.length?byName:byPhone;selected=found.length===1?0:null;stage=found.length===0?"new":found.length===1?"found":"multiple";render()}$("screen").addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="identify"){name=$("name").value.trim();phone=$("phone").value.trim();if(phone.replace(/\D/g,"").length<10){$("error").textContent="Enter a valid phone number.";return}lookup()}else if(e.target.id==="enrollment"){stage="done";render()}});$("screen").addEventListener("click",e=>{if(e.target.id==="privacy-link"){e.preventDefault();alert("Demo notice: this sandbox processes fictional or visitor-entered values only in your browser, without saving them to a server. The consent wording is illustrative and not a production privacy policy.");return}const choice=e.target.closest("[data-select]");if(choice){selected=Number(choice.dataset.select);render();return}const b=e.target.closest("[data-action]");if(!b)return;switch(b.dataset.action){case"continue":if(selected===null){$("error")&&($("error").textContent="Choose an application to continue.");return}newApplication=false;stage="form";break;case"not-mine":newApplication=true;stage="new";break;case"start":newApplication=true;stage="form";break;case"back":stage=stage==="form"?(newApplication?"new":found.length===1?"found":"multiple"):"identify";break;case"reset":stage="identify";name="";phone="";found=[];selected=null;newApplication=false;break}render()});render()})();</script></body></html>
