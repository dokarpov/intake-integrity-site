name: MVP test gate (no deployment)
on:
  push:
    branches: [testing/mvp-hardening]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test mvp/engine.test.mjs server/*.test.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=mvp/playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp-browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
