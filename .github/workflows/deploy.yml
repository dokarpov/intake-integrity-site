name: Scan and deploy public demo
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - 'scripts/**'
      - 'index.html'
      - 'decision-lab.html'
      - 'setup.html'
      - 'preview/**'
      - 'mvp/**'
      - 'testing/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run simulated intake regression scenarios
        run: node --test mvp/engine.test.mjs mvp/scenarios-12.test.mjs
      - name: Scan publishable files
        run: python3 scripts/check_public.py
      - name: Check public artifact allowlist
        run: |
          mkdir -p dist
          cp index.html decision-lab.html setup.html dist/
          mkdir -p dist/preview
          cp preview/index.html preview/operator.html preview/tokens.css preview/integrations.html dist/preview/
          mkdir -p dist/mvp
          cp mvp/index.html mvp/engine.mjs dist/mvp/
          mkdir -p dist/testing/integrity
          cp testing/integrity/index.html testing/integrity/engine.mjs testing/integrity/policy.mjs dist/testing/integrity/
          mkdir -p dist/testing/story
          cp testing/story/index.html dist/testing/story/
          test "$(find dist -type f | wc -l)" -eq 13
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium testing dependencies
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start fictional demo HTTP server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/intake-server.log 2>&1 &
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:4173/testing/story/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/intake-server.log
          exit 1
      - name: Verify responsive UI, synthetic boundaries and scroll story
        run: npx playwright test scripts/preview.spec.cjs scripts/evidence-preview.spec.cjs scripts/scroll-story.spec.cjs --browser chromium --workers=1 --reporter=line
  deploy:
    if: github.event_name != 'pull_request'
    needs: [verify, browser]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan and build minimal public artifact
        run: |
          python3 scripts/check_public.py
          mkdir -p dist/preview
          cp index.html decision-lab.html setup.html dist/
          cp preview/index.html preview/operator.html preview/tokens.css preview/integrations.html dist/preview/
          mkdir -p dist/mvp
          cp mvp/index.html mvp/engine.mjs dist/mvp/
          mkdir -p dist/testing/integrity
          cp testing/integrity/index.html testing/integrity/engine.mjs testing/integrity/policy.mjs dist/testing/integrity/
          mkdir -p dist/testing/story
          cp testing/story/index.html dist/testing/story/
          test "$(find dist -type f | wc -l)" -eq 13
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
